<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
  </defs>

  <!-- Title & Status Header -->
  <text x="30" y="38" fill="#58a6ff" font-size="16" font-weight="600" letter-spacing="0.5">T-GEMM CORE: CYCLE-ACCURATE SYSTOLIC SIMULATION TRACE</text>
  <rect x="680" y="20" width="210" height="26" rx="13" fill="url(#passGrad)"/>
  <text x="785" y="37" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">VERIFIED: ZERO MULTIPLIERS</text>

  <!-- Timeline Grid Lines -->
  <g stroke="#21262d" stroke-width="1" stroke-dasharray="3 3">
    <line x1="200" y1="60" x2="200" y2="420"/>
    <line x1="270" y1="60" x2="270" y2="420"/>
    <line x1="340" y1="60" x2="340" y2="420"/>
    <line x1="410" y1="60" x2="410" y2="420"/>
    <line x1="480" y1="60" x2="480" y2="420"/>
    <line x1="550" y1="60" x2="550" y2="420"/>
    <line x1="620" y1="60" x2="620" y2="420"/>
    <line x1="690" y1="60" x2="690" y2="420"/>
    <line x1="760" y1="60" x2="760" y2="420"/>
    <line x1="830" y1="60" x2="830" y2="420"/>
  </g>

  <!-- Cycle Labels -->
  <g fill="#8b949e" font-size="11" font-family="monospace" text-anchor="middle">
    <text x="200" y="75">RST</text>
    <text x="270" y="75">LOAD_W</text>
    <text x="340" y="75">SHIFT</text>
    <text x="410" y="75">T0 (A0)</text>
    <text x="480" y="75">T1 (A1)</text>
    <text x="550" y="75">T2 (A2)</text>
    <text x="620" y="75">T3 (A3)</text>
    <text x="690" y="75">COL0</text>
    <text x="760" y="75">COL1</text>
    <text x="830" y="75">COL2-3</text>
  </g>

  <!-- Signal Labels -->
  <g fill="#c9d1d9" font-size="12" font-family="monospace" font-weight="600">
    <text x="30" y="112">clk (100MHz)</text>
    <text x="30" y="152">rst_n</text>
    <text x="30" y="192">load_weights</text>
    <text x="30" y="240">act_in_bus[31:0]</text>
    <text x="30" y="290">psum_out[0] (Col 0)</text>
    <text x="30" y="335">psum_out[1] (Col 1)</text>
    <text x="30" y="380">psum_out[2] (Col 2)</text>
    <text x="30" y="425">psum_out[3] (Col 3)</text>
  </g>

  <!-- 1. clk -->
  <path d="M 180,115 L 200,115 L 200,95 L 235,95 L 235,115 L 270,115 L 270,95 L 305,95 L 305,115 L 340,115 L 340,95 L 375,95 L 375,115 L 410,115 L 410,95 L 445,95 L 445,115 L 480,115 L 480,95 L 515,95 L 515,115 L 550,115 L 550,95 L 585,95 L 585,115 L 620,115 L 620,95 L 655,95 L 655,115 L 690,115 L 690,95 L 725,95 L 725,115 L 760,115 L 760,95 L 795,95 L 795,115 L 830,115 L 830,95 L 865,95 L 865,115 L 890,115" fill="none" stroke="#58a6ff" stroke-width="2"/>

  <!-- 2. rst_n -->
  <path d="M 180,155 L 220,155 L 220,135 L 890,135" fill="none" stroke="#79c0ff" stroke-width="2"/>

  <!-- 3. load_weights -->
  <path d="M 180,195 L 245,195 L 245,175 L 380,175 L 380,195 L 890,195" fill="none" stroke="#d2a8ff" stroke-width="2"/>

  <!-- 4. act_in_bus (Bus representation) -->
  <g>
    <!-- Idle -->
    <line x1="180" y1="230" x2="395" y2="230" stroke="#7ee787" stroke-width="2"/>
    <!-- T0: [10, 0, 0, 0] -->
    <polygon points="395,230 405,215 465,215 475,230 465,245 405,245" fill="url(#busGrad)" stroke="#7ee787" stroke-width="1.5"/>
    <text x="435" y="234" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">[10,0,0,0]</text>
    <!-- T1: [0, 20, 0, 0] -->
    <polygon points="465,230 475,215 535,215 545,230 535,245 475,245" fill="url(#busGrad)" stroke="#7ee787" stroke-width="1.5"/>
    <text x="505" y="234" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">[0,20,0,0]</text>
    <!-- T2: [0, 0, 30, 0] -->
    <polygon points="535,230 545,215 605,215 615,230 605,245 545,245" fill="url(#busGrad)" stroke="#7ee787" stroke-width="1.5"/>
    <text x="575" y="234" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">[0,0,30,0]</text>
    <!-- T3: [0, 0, 0, 40] -->
    <polygon points="605,230 615,215 675,215 685,230 675,245 615,245" fill="url(#busGrad)" stroke="#7ee787" stroke-width="1.5"/>
    <text x="645" y="234" fill="#ffffff" font-size="10" font-family="monospace" text-anchor="middle">[0,0,0,40]</text>
    <!-- Back to zero -->
    <line x1="685" y1="230" x2="890" y2="230" stroke="#7ee787" stroke-width="2"/>
  </g>

  <!-- 5. psum_out[0] -> 20 at cycle 690 -->
  <line x1="180" y1="280" x2="680" y2="280" stroke="#ffa657" stroke-width="2"/>
  <polygon points="680,280 690,268 740,268 750,280 740,292 690,292" fill="#ffa657" fill-opacity="0.3" stroke="#ffa657" stroke-width="1.5"/>
  <text x="715" y="284" fill="#ffffff" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">+20</text>
  <line x1="750" y1="280" x2="890" y2="280" stroke="#ffa657" stroke-width="2"/>

  <!-- 6. psum_out[1] -> 30 at cycle 760 -->
  <line x1="180" y1="325" x2="750" y2="325" stroke="#ffa657" stroke-width="2"/>
  <polygon points="750,325 760,313 810,313 820,325 810,337 760,337" fill="#ffa657" fill-opacity="0.3" stroke="#ffa657" stroke-width="1.5"/>
  <text x="785" y="329" fill="#ffffff" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">+30</text>
  <line x1="820" y1="325" x2="890" y2="325" stroke="#ffa657" stroke-width="2"/>

  <!-- 7. psum_out[2] -> -30 at cycle 820 -->
  <line x1="180" y1="370" x2="815" y2="370" stroke="#ff7b72" stroke-width="2"/>
  <polygon points="815,370 825,358 870,358 880,370 870,382 825,382" fill="#ff7b72" fill-opacity="0.3" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="848" y="374" fill="#ffffff" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">-30</text>
  <line x1="880" y1="370" x2="890" y2="370" stroke="#ff7b72" stroke-width="2"/>

  <!-- 8. psum_out[3] -> +20 at cycle 875 -->
  <line x1="180" y1="415" x2="865" y2="415" stroke="#ffa657" stroke-width="2"/>
  <polygon points="865,415 872,403 888,403 890,415 888,427 872,427" fill="#ffa657" fill-opacity="0.3" stroke="#ffa657" stroke-width="1.5"/>
  <text x="880" y="419" fill="#ffffff" font-size="10" font-family="monospace" font-weight="700" text-anchor="middle">+20</text>
</svg>
